<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>elevator</title>
<style>
body{margin:0;min-height:100vh;background:#8d8a83;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(#a19e96,#7c7972);font-family:Arial,sans-serif;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.shaft{display:flex;flex-direction:column;align-items:center}
.disp{background:#140a00;color:#ff8c1a;font:bold 34px "Courier New",monospace;padding:4px 18px;border:3px solid #555;margin-bottom:10px;min-width:90px;text-align:center;text-shadow:0 0 8px #f60}
.car{position:relative;width:min(340px,80vw);aspect-ratio:3/4;background:#f3ead8;overflow:hidden;border:10px solid #6b6862;box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.flr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:18px/1.45 Georgia,serif;color:#2b2621}
.dl,.dr{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#b9b6ae,#d8d5cd 50%,#a9a69e);transition:transform 1.4s ease-in-out;z-index:2;box-shadow:inset 0 0 0 1px #888}
.dl{left:0}.dr{right:0}.car.open .dl{transform:translateX(-100%)}.car.open .dr{transform:translateX(100%)}
.panel{background:linear-gradient(#c9c6be,#a8a59d);border:4px solid #6b6862;padding:12px;border-radius:4px;max-height:80vh;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(5,36px);gap:7px}
.grid button{width:36px;height:36px;border-radius:50%;border:2px solid #555;background:radial-gradient(circle at 40% 35%,#fff,#bbb);font:bold 11px Arial;cursor:pointer;padding:0}
.grid button.lit{background:radial-gradient(circle at 40% 35%,#fff7cc,#ffb000);box-shadow:0 0 8px #ffb000}
.ctl{margin-top:10px;display:flex;gap:8px;justify-content:space-between;font-size:12px}
.ctl button{font:12px Arial;cursor:pointer}
a{color:#222;font-size:12px}
</style></head><body>
<div class="shaft"><div class="disp" id="d">1</div><div class="car open" id="car"><div class="flr" id="f"></div><div class="dl"></div><div class="dr"></div></div></div>
<div class="panel"><div class="grid" id="g"></div><div class="ctl"><button id="mus">music: off</button><a href="/">exit</a></div></div>
<script>
const special={1:'the lobby. there is a plant. the plant is fake. the receptionist is also fake.',2:'accounting. everyone turns to look at you. nobody says anything.',4:'floor 4 is closed due to floor 4.',7:'a petting zoo, but every animal is a cow.',13:'there is no floor 13. you are not here.',21:'a dentist office. a man in the waiting room has been here since 2009.',33:'the floor is lava. it is actual lava. close the doors.',42:'a single towel and a sign that says "you know why".',50:'halfway. there is a vending machine that only sells water. it is 9 dollars.',64:'a minecraft stack of everything. 64 chairs, 64 lamps, 64 confused interns.',69:'nice.',77:'a casino. you are not old enough. how do they know.',88:'a 1980s mall. it is still open. it should not be open.',99:'the roof. it is windy. a goose is up here. it has been waiting for you.',0:'the basement. you did not press this. why are you here.'};
const gen=['an office. a printer jams in the distance. someone sighs.','an empty floor with one chair facing the wall.','a hallway that smells like burnt popcorn.','a floor under construction. a guy in a hard hat says "not yet".','a waiting room. the magazines are from 2003.','a gym nobody uses. one treadmill is still running.','a room full of fax machines all receiving at once.','a server room. it is very loud and very cold.','a cafeteria serving one item: beige.','a floor that is exactly like the last floor. too exactly.'];
const G=document.getElementById('g'),car=document.getElementById('car'),D=document.getElementById('d'),F=document.getElementById('f');
let cur=1,busy=false,ac,mus=null;
for(let i=99;i>=1;i--){const b=document.createElement('button');b.textContent=i;b.onclick=()=>go(i,b);G.appendChild(b)}
const bb=document.createElement('button');bb.textContent='b';bb.onclick=()=>go(0,bb);G.appendChild(bb);
function desc(n){return special[n]||('floor '+n+': '+gen[(n*7)%gen.length])}
F.textContent=desc(1);
function A(){return ac=ac||new (window.AudioContext||window.webkitAudioContext)()}
function ding(){const a=A(),t=a.currentTime;[[1318,0],[1046,.35]].forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.18,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+1.2);o.connect(g);g.connect(a.destination);o.start(t+d);o.stop(t+d+1.3)})}
function go(n,b){if(busy||n===cur)return;busy=true;b.classList.add('lit');A();car.classList.remove('open');
  setTimeout(()=>{const step=n>cur?1:-1;const iv=setInterval(()=>{cur+=step;D.textContent=cur===0?'b':cur;if(cur===n){clearInterval(iv);F.textContent=desc(n);ding();setTimeout(()=>{car.classList.add('open');b.classList.remove('lit');busy=false},400)}},Math.max(40,600/Math.abs(n-cur+step)))},1500)}
document.getElementById('mus').onclick=e=>{const a=A();if(mus){clearInterval(mus);mus=null;e.target.textContent='music: off';return}e.target.textContent='music: on';
  const ch=[[261.6,329.6,392,493.9],[220,277.2,329.6,415.3],[293.7,349.2,440,523.3],[196,246.9,293.7,370]];let i=0;
  const play=()=>{const t=a.currentTime;ch[i%4].forEach((f,j)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+j*.22);g.gain.linearRampToValueAtTime(.05,t+j*.22+.03);g.gain.exponentialRampToValueAtTime(.001,t+j*.22+1.6);o.connect(g);g.connect(a.destination);o.start(t+j*.22);o.stop(t+j*.22+1.7)});
    const bo=a.createOscillator(),bg=a.createGain();bo.type='triangle';bo.frequency.value=ch[i%4][0]/2;bg.gain.setValueAtTime(.12,t);bg.gain.exponentialRampToValueAtTime(.001,t+1.5);bo.connect(bg);bg.connect(a.destination);bo.start(t);bo.stop(t+1.6);i++};
  play();mus=setInterval(play,1800)};
</script>
<script src="/konami.js"></script>
</body></html>
