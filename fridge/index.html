<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>the fridge</title>
<style>
body{margin:0;min-height:100vh;background:#c9b48f;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 60px),linear-gradient(#d8c39c,#b9a27c);font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 10px;box-sizing:border-box}
#door{position:relative;width:min(560px,94vw);aspect-ratio:3/4;background:linear-gradient(100deg,#f4f4f0 0,#ffffff 30%,#ececE6 100%);border-radius:14px 14px 6px 6px;box-shadow:inset -8px 0 14px rgba(0,0,0,.06),0 8px 20px rgba(0,0,0,.3);border:1px solid #bdbdb5;touch-action:none;overflow:hidden}
#handle{position:absolute;left:14px;top:12%;width:14px;height:34%;background:linear-gradient(90deg,#999,#ddd,#888);border-radius:7px;box-shadow:2px 3px 4px rgba(0,0,0,.25)}
.l{position:absolute;font:900 clamp(26px,6vw,40px)/1 "Arial Black","Arial Bold",Arial,sans-serif;cursor:grab;user-select:none;-webkit-user-select:none;text-shadow:0 1px 0 rgba(255,255,255,.35),1px 2px 2px rgba(0,0,0,.35);touch-action:none}
.l.drag{cursor:grabbing;z-index:9;transform:scale(1.15) rotate(-4deg)}
.note{position:absolute;right:8%;top:6%;width:120px;background:#fff8a8;padding:10px;font:15px "Comic Sans MS","Comic Neue",cursive;transform:rotate(3deg);box-shadow:1px 2px 4px rgba(0,0,0,.25)}
.note:before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;border-radius:50%;background:#d62828;box-shadow:1px 1px 2px rgba(0,0,0,.4)}
p{color:#4a3d27;font-size:13px;text-align:center}
a{color:#4a3d27}
</style></head><body>
<div id="door"><div id="handle"></div><div class="note">everyone shares this fridge. be nice. or dont</div></div>
<p id="st">loading the fridge...</p>
<p><a href="/">landon.cool</a></p>
<script>
const API='https://api.landon.cool/api/fridge',door=document.getElementById('door'),st=document.getElementById('st');
let els={},drag=null;
function place(l){let e=els[l.id];if(!e){e=document.createElement('div');e.className='l';e.textContent=l.ch;e.style.color=l.c;e.dataset.id=l.id;door.appendChild(e);els[l.id]=e;e.addEventListener('pointerdown',down)}
  if(drag&&drag.id==l.id)return;e.style.left=(l.x*100)+'%';e.style.top=(l.y*100)+'%'}
function down(e){e.preventDefault();const el=e.currentTarget,r=door.getBoundingClientRect(),er=el.getBoundingClientRect();
  drag={id:+el.dataset.id,el,ox:e.clientX-er.left,oy:e.clientY-er.top};el.classList.add('drag');el.setPointerCapture(e.pointerId)}
addEventListener('pointermove',e=>{if(!drag)return;const r=door.getBoundingClientRect();
  const x=Math.max(0,Math.min(.96,(e.clientX-drag.ox-r.left)/r.width)),y=Math.max(0,Math.min(.95,(e.clientY-drag.oy-r.top)/r.height));
  drag.x=x;drag.y=y;drag.el.style.left=x*100+'%';drag.el.style.top=y*100+'%'});
addEventListener('pointerup',async()=>{if(!drag)return;const d=drag;drag=null;d.el.classList.remove('drag');if(d.x==null)return;
  try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:d.id,x:d.x,y:d.y})});const j=await r.json();if(j.letters)j.letters.forEach(place);else st.textContent=j.error||''}catch(e){st.textContent='cant reach the fridge server'}});
async function poll(){try{const j=await(await fetch(API)).json();j.letters.forEach(place);st.textContent='drag the letters. other people can see your mess'}catch(e){st.textContent='the fridge server is down, try later'}}
poll();setInterval(poll,2500);
</script>
<script src="/konami.js"></script>
</body></html>
