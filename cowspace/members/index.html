<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cowspace members</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e5e5e5;font:13px Verdana,Tahoma,sans-serif;color:#111}
.top{background:#036;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .logo{font:bold 22px Verdana,sans-serif;color:#fff;text-decoration:none;letter-spacing:-1px}
.top .logo span{color:#fc0}
.top .sp{flex:1}
.top a.l{color:#cde;font-size:12px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.box{background:#fff;border:1px solid #6699cc;margin-bottom:12px}
.box>h2{margin:0;background:#6699cc;color:#fff;font:bold 13px Verdana;padding:5px 8px}
.box .in{padding:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:13px Verdana,sans-serif;padding:4px 6px;border:1px solid #999}
input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.m{display:block;text-align:center;color:#036;text-decoration:none;padding:8px;border:1px solid #ddd;background:#fafafa}
.m:hover{border-color:#6699cc;background:#fff}
.m img{display:block;width:72px;height:72px;margin:0 auto 6px;image-rendering:pixelated;border:1px solid #ccc;background:#fff}
.m b{display:block;word-break:break-all}
.m .s{font-size:11px;color:#777;margin-top:2px}
.m .role{display:inline-block;font:bold 9px Verdana;background:#fc0;color:#000;padding:1px 4px;text-transform:uppercase;margin-top:3px}
#more{display:block;margin:12px auto 0;font:bold 12px Verdana;background:#fc0;border:1px solid #a80;padding:6px 16px;cursor:pointer}
.dim{color:#777}
</style>
</head>
<body>
<div class="top"><a class="logo" href="/cowspace/">cow<span>space</span></a><span>members</span><span class="sp"></span><a class="l" href="/cowspace/">my cowspace</a><a class="l" href="/">landon.cool</a></div>
<div class="wrap">
  <div class="box"><h2>find cows <span id="total" style="font-weight:normal"></span></h2><div class="in">
    <div class="bar">
      <input id="q" placeholder="search usernames" aria-label="search usernames" autocomplete="off" spellcheck="false" autocapitalize="off">
      <select id="sort" aria-label="sort"><option value="new">newest</option><option value="old">oldest</option><option value="friends">most friends</option><option value="name">a-z</option></select>
    </div>
  </div></div>
  <div class="box"><div class="in"><div class="grid" id="grid"><span class="dim">loading...</span></div><button id="more" hidden>more cows</button></div></div>
</div>
<script src="/cowspace/cs.js"></script>
<script>
// everyone on cowspace, 30 at a time
const $ = id => document.getElementById(id), esc = CS.esc;
let page = 0, t = null;
async function load(append) {
  page = append ? page + 1 : 0;
  try {
    const j = await CS.api(`/members?sort=${$('sort').value}&q=${encodeURIComponent($('q').value.trim())}&page=${page}`);
    $('total').textContent = `(${j.total} member${j.total === 1 ? '' : 's'})`;
    const html = j.members.map(m => `<a class="m" href="/@${esc(m.username)}"><img src="${CS.avatarUrl(m.avatar)}" alt=""><b>${esc(m.username)}</b>
      ${m.role !== 'user' ? `<span class="role">${esc(m.role)}</span>` : ''}
      <div class="s">${m.friendCount} friend${m.friendCount === 1 ? '' : 's'}</div>
      ${m.mood && m.mood.t ? `<div class="s">${esc(m.mood.e || '')} ${esc(m.mood.t)}</div>` : ''}</a>`).join('');
    if (append) $('grid').insertAdjacentHTML('beforeend', html);
    else $('grid').innerHTML = html || '<span class="dim">no cows found</span>';
    $('more').hidden = !j.more;
  } catch (e) { $('grid').innerHTML = `<span class="dim">${esc(e.message)}</span>`; }
}
$('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => load(false), 250); });
$('sort').addEventListener('change', () => load(false));
$('more').addEventListener('click', () => load(true));
load(false);
</script>
</body>
</html>
