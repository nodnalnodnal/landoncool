<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sign my guestbook!!!</title>
<style>
body{margin:0;background:#000033;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#aaf 1px,transparent 1.5px);background-size:61px 53px,37px 41px;background-position:0 0,19px 23px;color:#fff;font-family:"Times New Roman",Times,serif;font-size:17px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{text-align:center;color:#ffff00;font-size:40px;margin:10px 0;text-shadow:3px 3px 0 #ff00ff;font-style:italic}
marquee,.mq{color:#00ff00;font-family:Verdana,Tahoma,sans-serif}
.mq{overflow:hidden;white-space:nowrap}.mq span{display:inline-block;padding-left:100%;animation:mq 14s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
hr{border:0;height:6px;background:repeating-linear-gradient(90deg,red 0 20px,orange 20px 40px,yellow 40px 60px,lime 60px 80px,cyan 80px 100px,blue 100px 120px,magenta 120px 140px)}
.uc{background:repeating-linear-gradient(45deg,#ffd800 0 14px,#000 14px 28px);padding:4px;text-align:center;margin:14px 0}
.uc span{background:#ffd800;color:#000;font:bold 14px Arial;padding:2px 8px}
.hits{text-align:center;margin:14px 0;font-size:14px}
.dig{display:inline-block;background:#000;color:#33ff33;font:bold 20px "Courier New",monospace;border:2px inset #666;padding:0 3px;margin:0 1px}
table.f{background:#c0c0c0;color:#000;border:3px outset #fff;margin:0 auto;font-size:15px}
table.f td{padding:4px}
input,textarea{font:15px "Times New Roman",serif;width:260px;box-sizing:border-box}
textarea{height:80px}
button{font:bold 15px Arial;background:#c0c0c0;border:3px outset #fff;padding:3px 14px;cursor:pointer}
button:active{border-style:inset}
#err{color:#c00;font-weight:bold}
.e{border:3px ridge #ccc;background:#000066;margin:12px 0;padding:8px 12px}
.e .nm{color:#ff9900;font-weight:bold}
.e .fr{color:#99ccff;font-size:14px}
.e .dt{color:#888;font-size:13px;float:right}
.e .ms{margin-top:6px;white-space:pre-wrap;word-wrap:break-word}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{visibility:hidden}}
a{color:#00ffff}a:visited{color:#ff66ff}
.ft{text-align:center;font-size:13px;color:#aaa;margin:30px 0}
#pad{width:160px;height:160px;image-rendering:pixelated;background:#fff;border:2px inset #888;cursor:crosshair;touch-action:none;display:block}
.pal{display:flex;flex-wrap:wrap;gap:2px;width:160px;margin-top:4px}
.pal button{width:18px;height:18px;padding:0;border:2px outset #fff}
.pal button.on{border:2px inset #000;outline:1px solid #000}
.small{font-size:12px}
.e canvas{float:left;width:64px;height:64px;image-rendering:pixelated;background:#fff;border:2px ridge #ccc;margin:0 10px 4px 0}
.e:after{content:"";display:block;clear:both}
.e .av{width:20px;height:20px;image-rendering:pixelated;vertical-align:-4px;margin-right:4px;background:#fff;border:1px solid #ccc}
.e a.nm{text-decoration:none}.e a.nm:hover{text-decoration:underline}
.e .ok{color:#6cf;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>~*~ my guestbook ~*~</h1>
<div class="mq"><span>welcome to my guestbook!!! please sign it!!! no spam or my cow will find you!!!</span></div>
<hr>
<div class="hits">you are visitor number<br><span id="hits"></span></div>
<div class="uc"><span>always under construction</span></div>
<table class="f"><tr><td>name:</td><td><input id="name" maxlength="40"><label id="asMeRow" class="small" hidden style="display:block;margin-top:3px"><input type="checkbox" id="asMe" checked style="width:auto"> sign as <span id="meName"></span></label></td></tr>
<tr><td>where u from:</td><td><input id="from" maxlength="60"></td></tr>
<tr><td valign="top">message:</td><td><textarea id="msg" maxlength="500"></textarea></td></tr>
<tr><td valign="top">doodle:<br><span class="small">(optional)</span></td><td><canvas id="pad" width="16" height="16" aria-label="draw a doodle"></canvas><div class="pal" id="pal"></div><button type="button" id="clr" class="small" style="margin-top:4px;font-size:12px;padding:1px 8px">clear</button></td></tr>
<tr><td></td><td><button id="sign">sign it</button> <span id="err"></span></td></tr></table>
<hr>
<div id="list"><p style="text-align:center">loading entries...</p></div>
<div class="ft"><span class="blink">new!</span> best viewed in netscape navigator 4.0 at 800x600<br><a href="/">back to landon.cool</a></div>
</div>
<script src="/cowspace/cs.js"></script>
<script>
const L=document.getElementById('list'),E=document.getElementById('err');
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function show(j,hit){
  if(hit){const h=document.getElementById('hits');h.innerHTML='';String(j.hits).padStart(6,'0').split('').forEach(d=>h.appendChild(el('span','dig',d)))}
  L.innerHTML='';
  if(!j.entries.length){L.appendChild(el('p',null,'nobody has signed yet. be the first!!!'));return}
  j.entries.forEach(x=>{const d=el('div','e');if(x.d)d.appendChild(doodle(x.d));d.appendChild(el('span','dt',new Date(x.t).toLocaleDateString()));if(x.u){const a=el('a','nm');a.href='/@'+encodeURIComponent(x.u);const im=document.createElement('img');im.className='av';im.alt='';im.src=CS.avatarUrl(x.avatar);a.append(im,x.name);d.appendChild(a);d.appendChild(el('span','ok',' \u2713'))}else d.appendChild(el('span','nm',x.name));if(x.from)d.appendChild(el('span','fr',' from '+x.from));d.appendChild(el('div','ms',x.msg));L.appendChild(d)});
}
// doodles: 16x16 pixels, each one a hex digit picking a color from PAL. 0 is blank
const PAL=['','#000','#fff','#e00','#f80','#ff0','#6f3','#070','#0ff','#03f','#90f','#f6c','#842','#888','#ccc','#fc9'];
const pad=document.getElementById('pad'),pctx=pad.getContext('2d'),px=Array(256).fill('0');let pen='1',down=false;
function paint(){pctx.clearRect(0,0,16,16);px.forEach((c,i)=>{if(c!=='0'){pctx.fillStyle=PAL[parseInt(c,16)];pctx.fillRect(i%16,i/16|0,1,1)}})}
function doodle(str){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');[...str].forEach((ch,i)=>{if(ch!=='0'){g.fillStyle=PAL[parseInt(ch,16)];g.fillRect(i%16,i/16|0,1,1)}});return c}
function dot(e){const r=pad.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*16),y=Math.floor((e.clientY-r.top)/r.height*16);if(x<0||y<0||x>15||y>15)return;px[y*16+x]=pen;paint()}
pad.addEventListener('pointerdown',e=>{down=true;pad.setPointerCapture(e.pointerId);dot(e)});
pad.addEventListener('pointermove',e=>{if(down)dot(e)});
pad.addEventListener('pointerup',()=>down=false);pad.addEventListener('pointercancel',()=>down=false);
const palEl=document.getElementById('pal');
PAL.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.style.background=c||'repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/8px 8px';b.title=i?c:'eraser';b.setAttribute('aria-label',i?'color '+c:'eraser');if(i===1)b.className='on';b.onclick=()=>{pen=i.toString(16);palEl.querySelectorAll('button').forEach(x=>x.className='');b.className='on'};palEl.appendChild(b)});
document.getElementById('clr').onclick=()=>{px.fill('0');paint()};
async function load(hit){try{const r=await fetch('https://api.landon.cool/api/guestbook'+(hit?'?hit=1':''));show(await r.json(),hit)}catch(e){L.innerHTML='';L.appendChild(el('p',null,'the guestbook server is down. try again later'))}}
document.getElementById('sign').onclick=async()=>{
  E.textContent='';
  const b={name:document.getElementById('name').value,from:document.getElementById('from').value,msg:document.getElementById('msg').value,doodle:px.join('')};
  const drew=/[1-9a-f]/.test(b.doodle);if(!drew)delete b.doodle;
  if(!b.name.trim()||(!b.msg.trim()&&!drew)){E.textContent='you need a name and a message (or a doodle)';return}
  const me=asMe();
  try{const r=await fetch('https://api.landon.cool/api/guestbook',{method:'POST',headers:{'content-type':'application/json',...(me?{authorization:'Bearer '+CS.token()}:{})},body:JSON.stringify(b)});const j=await r.json();
    if(!r.ok){E.textContent=j.error||'that didnt work';return}
    document.getElementById('msg').value='';px.fill('0');paint();E.textContent='thx!!!';load(false);
  }catch(e){E.textContent='cant reach the server, try again later'}
};
// cowspace: logged in, you sign as yourself (with your avatar). untick the box to sign as a guest
const asMe=()=>CS.token()&&!document.getElementById('asMeRow').hidden&&document.getElementById('asMe').checked;
CS.me().then(me=>{if(!me)return;const n=document.getElementById('name');document.getElementById('meName').textContent='@'+me.username;document.getElementById('asMeRow').hidden=false;
  const sync=()=>{const on=document.getElementById('asMe').checked;n.readOnly=on;n.value=on?me.username:'';};document.getElementById('asMe').onchange=sync;sync()});
load(true);
</script>
<script src="/konami.js"></script>
</body>
</html>
