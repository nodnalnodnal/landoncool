<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hi</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:#c8d6c0;font-family:Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background 3s}
.eyes{display:flex;gap:6vw}
.eye{width:min(26vw,220px);aspect-ratio:1;background:#fff;border-radius:50%;position:relative;overflow:hidden;box-shadow:inset 0 -10px 20px rgba(0,0,0,.12),0 4px 10px rgba(0,0,0,.2)}
.veins{position:absolute;inset:0;opacity:0;transition:opacity 4s}
.pupil{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;background:radial-gradient(circle at 50% 50%,#000 0 40%,#5a3a1a 41% 100%);border-radius:50%;transition:width 3s,height 3s,margin 3s}
.pupil:after{content:"";position:absolute;left:20%;top:18%;width:20%;height:20%;background:#fff;border-radius:50%}
.lid{position:absolute;left:0;right:0;top:0;height:0;background:#d9a77f;transition:height .08s}
#say{margin-top:6vh;font-size:18px;color:#333;min-height:1.5em;text-align:center;padding:0 20px}
a{position:fixed;bottom:10px;font-size:11px;color:#666}
</style></head><body>
<div class="eyes"><div class="eye"><svg class="veins" viewBox="0 0 100 100"><path d="M0 40 Q15 45 22 38 T35 44M100 55 Q85 50 80 58 T66 52M10 80 Q25 72 30 78M90 20 Q78 28 72 22" stroke="#d33" stroke-width="1" fill="none"/></svg><div class="pupil"></div><div class="lid"></div></div>
<div class="eye"><svg class="veins" viewBox="0 0 100 100"><path d="M0 50 Q12 44 20 52 T34 47M100 35 Q88 42 80 36 T68 42M15 15 Q25 25 32 20M85 85 Q74 76 68 82" stroke="#d33" stroke-width="1" fill="none"/></svg><div class="pupil"></div><div class="lid"></div></div></div>
<div id="say"></div>
<a href="/">leave</a>
<script>
const P=[...document.querySelectorAll('.pupil')],E=[...document.querySelectorAll('.eye')],L=[...document.querySelectorAll('.lid')],V=[...document.querySelectorAll('.veins')],S=document.getElementById('say');
let mx=innerWidth/2,my=innerHeight/2;const t0=Date.now();
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
const lines=[[0,''],[8,'hi'],[20,'...'],[35,'you can leave whenever'],[55,'you are still here'],[80,'why are you still here'],[110,'i can see you'],[140,'blink first'],[180,'i dont blink. i dont have to'],[230,'please'],[300,'ok i think we are friends now'],[400,'this is our life now']];
(function loop(){
  const s=(Date.now()-t0)/1000;
  E.forEach((e,i)=>{const r=e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,a=Math.atan2(my-cy,mx-cx),d=Math.min(r.width*.26,Math.hypot(mx-cx,my-cy)/4);
    const jit=s>110?(Math.random()-.5)*Math.min(6,(s-110)/20):0;P[i].style.transform=`translate(${Math.cos(a)*d+jit}px,${Math.sin(a)*d+jit}px)`});
  const sz=Math.max(18,42-s/6);P.forEach(p=>{p.style.width=p.style.height=sz+'%';p.style.margin=`-${sz/2}% 0 0 -${sz/2}%`});
  if(s>60)V.forEach(v=>v.style.opacity=Math.min(1,(s-60)/120));
  if(s>140)document.body.style.background='#d8c8b8';
  let l='';for(const[k,v]of lines)if(s>=k)l=v;if(S.textContent!==l)S.textContent=l;
  requestAnimationFrame(loop)})();
function blink(){if((Date.now()-t0)/1000>140&&(Date.now()-t0)/1000<300)return setTimeout(blink,2000);L.forEach(l=>l.style.height='100%');setTimeout(()=>L.forEach(l=>l.style.height='0'),110);setTimeout(blink,2500+Math.random()*4000)}
setTimeout(blink,3000);
</script>
<script src="/konami.js"></script>
</body></html>
